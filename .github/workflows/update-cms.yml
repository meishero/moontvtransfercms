name: Update cms.json

on:
  schedule:
    # GitHub Actions 使用 UTC 时间：19:00 UTC = 北京时间次日 03:00（每天凌晨 3 点）
    - cron: "0 19 * * *"
  workflow_dispatch: # 允许在 Actions 页面手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 Action 提交并推送 cms.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 拉取订阅并转换为 LibreTV CMS JSON
        env:
          SUB_URL: "https://pz.v88.qzz.io?format=2&source=jin18"
        run: python convert.py

      - name: 提交并推送 cms.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cms.json
          if git diff --staged --quiet; then
            echo "cms.json 无变化，跳过提交"
          else
            git commit -m "chore: 更新 cms.json $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
